name: Pente House quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Content sanity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Rua da Constituição 656, Loja 20" index.html
          grep -q "Rascal é o CEO" index.html
          grep -q "ESCOLHE O TEU CORTE" index.html
          grep -q "13,50 €" index.html
          grep -q "Seg–Sex 10–20" index.html
          grep -q "MAIS PEDIDO" index.html
          grep -q "PEDIR RESERVA NO WHATSAPP" index.html
          grep -q "100% do serviço" index.html
          grep -q "Quero pagar os " index.html
          grep -q "pentehouse-interior.webp" index.html
          grep -q "pentehouse-interior-720.webp" index.html
          grep -q 'aria-expanded="false"' index.html
          grep -q "POR DENTRO DA CASA · PORTO" index.html
          grep -q "AQUI POMOS TUDO NA LINHA" index.html
          grep -q "GRENHA" index.html
          grep -q "RESERVAR O MEU CORTE" index.html
          grep -q "PEDIR DISPONIBILIDADE" index.html
          grep -q "confirmamos se existe disponibilidade" index.html
          if grep -q "PRÓXIMOS HORÁRIOS LIVRES" index.html; then
            echo "Live availability UI must remain disabled during the initial booking phase."
            exit 1
          fi
          if grep -q "PENTE_AVAILABILITY_API" index.html; then
            echo "Live availability API must remain disabled during the initial booking phase."
            exit 1
          fi
          if grep -q "arcade-ticker" index.html; then
            echo "Old ticker arcade treatment still present."
            exit 1
          fi
          if grep -q "Rua da Constituição 19" index.html; then
            echo "Old incorrect address still present."
            exit 1
          fi

      - name: Inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/application\/ld\+json/i.test(match[1]) && !/\bsrc\s*=/i.test(match[1]))
            .map(match => match[2])
            .filter(code => code.trim());
          if (!scripts.length) throw new Error('No inline script found.');
          scripts.forEach((code, index) => {
            const file = `/tmp/pente-inline-${index}.js`;
            fs.writeFileSync(file, code);
            require('child_process').execFileSync(process.execPath, ['--check', file], {stdio:'inherit'});
          });
          NODE
