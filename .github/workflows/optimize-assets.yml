name: Optimize Pente House images

on:
  push:
    branches: [main]
    paths:
      - 'public/images/*.jpg'
      - 'public/images/*.png'
      - 'scripts/optimize-assets.mjs'
      - '.github/workflows/optimize-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pentehouse-image-optimization
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate WebP assets
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/optimize-assets.mjs

      - name: Commit optimized images
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- public/images/*.webp)" ]; then
            echo "No optimized image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/*.webp
          git commit -m "perf: generate optimized Pente House images"
          git push
